apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-deals-deployment
spec:
  replicas: 3
  # replicas: 1
  selector:
    matchLabels:
      app: transit-deals
  template:
    metadata:
      labels:
        app: transit-deals
    spec:
      containers:
      - name: transit-deals
        image: transit-deals-app:latest
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 8001