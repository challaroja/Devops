<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitDeals - Station Vending Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col justify-center items-center p-4">

    <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 space-y-6">
        <!-- Header -->
        <div class="text-center">
            <span class="text-xs bg-emerald-500/10 text-emerald-400 font-semibold px-3 py-1 rounded-full border border-emerald-500/20">Partner Kiosk Terminal</span>
            <h1 class="text-2xl font-bold mt-3">🏪 Station Vending Machine</h1>
            <p class="text-xs text-slate-400 mt-1">Scan passenger ticket QR or enter Ticket / Coupon code to claim your FMCG discount.</p>
        </div>

        <!-- Redemption Input Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Enter Ticket No or Coupon Code</label>
                <input type="text" id="coupon-input" placeholder="E.G. HYD-12345 OR COKE-555" 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none uppercase font-mono tracking-wider text-center text-lg">
            </div>

            <button onclick="redeemCoupon()" id="redeem-btn"
                class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-900/20 transition">
                Validate & Dispense Product
            </button>
        </div>

        <!-- Dynamic Result Box (Hidden initially) -->
        <div id="result-box" class="hidden p-4 rounded-xl text-center space-y-1.5 border">
            <!-- Backend response will appear here -->
        </div>

        <!-- Navigation back to Booking App -->
        <div class="text-center pt-4 border-t border-slate-700/60">
            <a href="/" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium transition">
                ← Switch to Passenger Booking App
            </a>
        </div>
    </div>

    <script>
        async function redeemCoupon() {
            const code = document.getElementById('coupon-input').value.trim();
            const resBox = document.getElementById('result-box');

            if (!code) {
                alert('Please enter a valid Ticket Number or Coupon Code!');
                return;
            }

            try {
                const response = await fetch('/api/validate-ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket_number: code })
                });

                const data = await response.json();
                resBox.classList.remove('hidden');

                if (response.ok && data.success) {
                    // Valid Coupon -> Green Success UI
                    resBox.className = "p-4 rounded-xl text-center space-y-1.5 border bg-emerald-950/60 border-emerald-500/40";
                    resBox.innerHTML = `
                        <h3 class="text-emerald-400 font-bold text-sm">✅ ${data.message}</h3>
                        <div class="text-xs text-slate-200 font-semibold">${data.brand} — ${data.offer}</div>
                        <div class="text-[11px] font-mono text-emerald-300 pt-1">Code Redeemed: ${data.coupon_code}</div>
                    `;
                } else if (response.ok && !data.success) {
                    // Already Redeemed -> Amber Warning UI
                    resBox.className = "p-4 rounded-xl text-center space-y-1 border bg-amber-950/60 border-amber-500/40";
                    resBox.innerHTML = `
                        <h3 class="text-amber-400 font-bold text-sm">⚠️ Already Used</h3>
                        <p class="text-xs text-slate-300">${data.message}</p>
                    `;
                } else {
                    // Invalid Code (404) -> Red Error UI
                    resBox.className = "p-4 rounded-xl text-center space-y-1 border bg-rose-950/60 border-rose-500/40";
                    resBox.innerHTML = `
                        <h3 class="text-rose-400 font-bold text-sm">❌ Invalid Code</h3>
                        <p class="text-xs text-slate-300">${data.detail || 'Ticket or Coupon not found in database.'}</p>
                    `;
                }
            } catch (err) {
                alert('Failed to connect to backend server!');
            }
        }
    </script>
</body>
</html>
